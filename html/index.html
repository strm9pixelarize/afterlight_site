<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>After#Light</title>
<meta name="description" content="After#Light の公式サイト。1stアルバム『スタートボタン』全12曲＋シングル「再起動の朝」をフリーで公開中。">
<link rel="icon" href="/favicon-v6.ico">
<link rel="apple-touch-icon" href="/icon-afterlight-v6.png">
<link rel="stylesheet" href="/css/style.css?v=20261124k">
</head>
<body>
<div class="al-loader" id="al-loader" aria-hidden="true">
  <div class="al-loader-logo"></div>
  <p class="al-loader-caption">NOW LOADING</p>
</div>
<header class="site-header" id="site-header"></header>

<section class="hero">
  <h1 class="hero-logo"><img class="hero-logo-img" src="/logo-afterlight-dark.png" alt="After#Light"></h1>
  <p class="hero-tagline">止まってた時間が、動き出す音。</p>
  <p class="hero-sub">Vocal: Asahi / Guest Vocal: Akari</p>
  <a class="scroll-hint" href="#latest-release" aria-label="下へスクロール"><span></span><span></span><span></span></a>
</section>

<main>
  <section>
    <h2>Latest Release</h2>
    <div id="latest-release"></div>
    <p class="release-more"><a href="/release/">すべてのリリースを見る →</a></p>
  </section>

  <section class="about" id="about">
    <h2>About</h2>
    <a class="about-card" href="/about.html">
      <img class="about-card-icon" id="about-icon" alt="">
      <div class="about-card-body">
        <p class="about-card-head"><span id="about-title"></span><span class="about-card-sub" id="about-subtitle"></span></p>
        <p class="about-card-tagline" id="about-tagline"></p>
        <p class="about-card-text" id="about-note"></p>
        <p class="about-card-more">メンバー紹介など、詳しく見る →</p>
      </div>
    </a>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<div class="player" id="player" hidden>
  <button class="player-toggle" id="playerToggle" type="button" aria-label="再生/停止">▶</button>
  <div class="player-info">
    <p class="player-title" id="playerTitle">—</p>
    <input class="player-seek" id="playerSeek" type="range" min="0" max="1000" value="0" aria-label="シーク">
  </div>
  <p class="player-time" id="playerTime">0:00</p>
</div>
<audio id="audio" preload="none" controlslist="nodownload"></audio>

<script src="/js/common.js?v=20261124a"></script>
<script src="/js/player.js?v=20261124g"></script>
<script src="/js/release.js?v=20261124f"></script>
<script src="/js/router.js?v=20261124g"></script>
<script src="/js/boot.js?v=20261124h"></script>
</body>
</html>
