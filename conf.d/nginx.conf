server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
    # リリースの自動検出: /releases/ 配下のフォルダ一覧を JSON で返す
    location /releases/ {
        autoindex on;
        autoindex_format json;
    }
    location ~ /\. {
        deny all;
    }

    add_header Content-Security-Policy "default-src 'self'; media-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'" always;
}
